<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Quest RPG - 100 Questions Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
        body {
            font-family: 'DotGothic16', sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            overflow: hidden;
            touch-action: manipulation;
        }
        .pixel-border {
            border: 4px solid #fff;
            image-rendering: pixelated;
        }
        .hp-bar-inner {
            transition: width 0.3s ease-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .animate-shake {
            animation: shake 0.2s ease-in-out 2;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        .screen-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
        }
        .damage-red { background-color: rgba(255, 0, 0, 0.4); animation: flash 0.3s ease-out; }
        .heal-green { background-color: rgba(0, 255, 0, 0.4); animation: flash 0.3s ease-out; }
        @keyframes flash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        .btn-pixel {
            position: relative;
            background: #444;
            box-shadow: 0 4px 0 #222;
            transition: all 0.1s;
        }
        .btn-pixel:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #222;
        }
    </style>
</head>

        <div class="flex justify-between items-center border-b-2 border-zinc-700 pb-2 text-sm">
            <div>Lv. <span id="player-lv">1</span> <span id="player-name">勇者</span></div>
            <div>Stage: <span id="current-stage">1</span></div>
        </div>
        <!-- Battle Screen -->
        <div class="relative bg-zinc-800 h-48 rounded flex items-center justify-center overflow-hidden border-2 border-zinc-700">
            <div class="absolute inset-0 opacity-20 pointer-events-none flex flex-wrap gap-4 p-2">
                <div class="w-8 h-8 bg-zinc-600 rounded-full"></div>
                <div class="w-8 h-8 bg-zinc-600 rounded-full self-end"></div>
            </div>
            <!-- Enemy Area -->
            <div id="enemy-container" class="flex flex-col items-center z-10">
                <div id="enemy-sprite" class="text-6xl mb-2 animate-float">👾</div>
                <div class="w-32 h-3 bg-gray-700 rounded-full overflow-hidden border border-white">
                    <div id="enemy-hp-bar" class="hp-bar-inner h-full bg-red-500" style="width: 100%;"></div>
                </div>
                <div id="enemy-name" class="text-xs mt-1">スライム</div>
            </div>
        </div>
        <!-- Player Status -->
        <div class="grid grid-cols-2 gap-4">
            <div class="flex flex-col">
                <span class="text-xs mb-1">HP: <span id="player-hp-text">100/100</span></span>
                <div class="w-full h-4 bg-gray-700 rounded-full overflow-hidden border border-white">
                    <div id="player-hp-bar" class="hp-bar-inner h-full bg-green-500" style="width: 100%;"></div>
                </div>
            </div>
            <div class="flex flex-col">
                <span class="text-xs mb-1">EXP: <span id="player-exp-text">0/10</span></span>
                <div class="w-full h-4 bg-gray-700 rounded-full overflow-hidden border border-white">
                    <div id="player-exp-bar" class="hp-bar-inner h-full bg-blue-500" style="width: 0%;"></div>
                </div>
            </div>
        </div>
        <!-- Message Area -->
        <div id="message-box" class="bg-black p-3 h-20 text-sm border-2 border-zinc-600 overflow-y-auto">
            モンスターがあらわれた！
        </div>
        <!-- Question Area -->
        <div id="quiz-area" class="flex flex-col gap-3">
            <div id="question-text" class="bg-zinc-800 p-3 min-h-[80px] flex items-center justify-center text-center border-2 border-zinc-700 rounded whitespace-pre-wrap">
                問題がここに表示されます。
            </div>
            <div id="options-grid" class="grid grid-cols-2 gap-2">
                <button onclick="handleAnswer(0)" class="btn-pixel p-3 text-sm rounded">選択肢1</button>
                <button onclick="handleAnswer(1)" class="btn-pixel p-3 text-sm rounded">選択肢2</button>
                <button onclick="handleAnswer(2)" class="btn-pixel p-3 text-sm rounded">選択肢3</button>
                <button onclick="handleAnswer(3)" class="btn-pixel p-3 text-sm rounded">選択肢4</button>
            </div>
        </div>

        <div id="overlay" class="absolute inset-0 bg-black/80 z-40 hidden flex-col items-center justify-center p-6 text-center">
            <h2 id="overlay-title" class="text-3xl mb-4">GAME OVER</h2>

            <button onclick="resetGame()" class="btn-pixel bg-blue-600 px-8 py-3 rounded">最初から遊ぶ</button>

            { name: "木のゴーレム", hp: 60, atk: 12, exp: 15, emoji: "🌲", element: "grass" },
            { name: "スケルトン", hp: 80, atk: 15, exp: 20, emoji: "💀", element: "water" },
            { name: "レッドドラゴン", hp: 150, atk: 25, exp: 50, emoji: "🐉", element: "fire" },
            { name: "大賢者", hp: 300, atk: 40, exp: 100, emoji: "🧙‍♂️", element: "grass" }
        ];
        let player = { lv: 1, hp: 100, maxHp: 100, atk: 10, exp: 0, nextExp: 10 };
        let currentEnemy = null;
        let currentStage = 0;
        let isProcessing = false;
        const elPlayerHpBar = document.getElementById('player-hp-bar');
        const elPlayerHpText = document.getElementById('player-hp-text');
        const elPlayerExpBar = document.getElementById('player-exp-bar');
        const elPlayerExpText = document.getElementById('player-exp-text');
        const elPlayerLv = document.getElementById('player-lv');
        const elEnemyHpBar = document.getElementById('enemy-hp-bar');
        const elEnemySprite = document.getElementById('enemy-sprite');
        const elEnemyName = document.getElementById('enemy-name');
        const elMsg = document.getElementById('message-box');
        const elQuestion = document.getElementById('question-text');
        const elOptions = document.getElementById('options-grid').children;
        const elStage = document.getElementById('current-stage');
        const elFlash = document.getElementById('flash-overlay');
        const elOverlay = document.getElementById('overlay');
        function initStage() {
            currentEnemy = { ...ENEMIES[Math.min(currentStage, ENEMIES.length - 1)] };
            const multiplier = 1 + (currentStage * 0.3);
            currentEnemy.maxHp = Math.floor(currentEnemy.hp * multiplier);
            currentEnemy.hp = currentEnemy.maxHp;
            currentEnemy.atk = Math.floor(currentEnemy.atk * multiplier);
            elEnemySprite.innerText = currentEnemy.emoji;
            elEnemyName.innerText = `${currentEnemy.name} (${getElementName(currentEnemy.element)})`;
            elStage.innerText = currentStage + 1;
            updateHPRender();
            updateMessage(`${currentEnemy.name}があらわれた！`);
            nextQuestion();
        }
        function getElementName(code) {
            switch(code) {
                case 'fire': return '火';
                case 'water': return '水';
                case 'grass': return '木';
                default: return '無';
            }
        }
        function updateMessage(txt) {
            elMsg.innerText = txt;
            elMsg.scrollTop = elMsg.scrollHeight;
        }
        function nextQuestion() {
            const quiz = QUIZ_DATABASE[Math.floor(Math.random() * QUIZ_DATABASE.length)];
            elQuestion.innerText = `[${getElementName(quiz.attr)}属性の問題]\n${quiz.q}`;
            elQuestion.dataset.correct = quiz.correct;
            elQuestion.dataset.attr = quiz.attr;
            for (let i = 0; i < 4; i++) {
                elOptions[i].innerText = quiz.a[i];
                elOptions[i].disabled = false;
                elOptions[i].className = "btn-pixel p-3 text-sm rounded bg-zinc-700";
            }
            isProcessing = false;
        }
        async function handleAnswer(index) {
            if (isProcessing) return;
            isProcessing = true;
            const correctIdx = parseInt(elQuestion.dataset.correct);
            const questionAttr = elQuestion.dataset.attr;
            
            for (let btn of elOptions) btn.disabled = true;
            if (index === correctIdx) {
                elOptions[index].classList.add('bg-green-600');
                updateMessage("正解！ ダメージを与えた！");
                
                let damage = player.atk;
                const multiplier = getAffinity(questionAttr, currentEnemy.element);
                damage = Math.floor(damage * multiplier);
                if (multiplier > 1) updateMessage("属性相性抜群！");
                if (multiplier < 1) updateMessage("属性相性が悪い...");
                await performAttack(elEnemySprite, damage, 'enemy');
                
                if (currentEnemy.hp <= 0) {
                    await handleEnemyDefeat();
                    return;
                }
            } else {
                elOptions[index].classList.add('bg-red-600');
                elOptions[correctIdx].classList.add('bg-green-600');
                updateMessage(`不正解！ 正解は「${elOptions[correctIdx].innerText}」だ！`);
                
                await performAttack(document.getElementById('game-container'), currentEnemy.atk, 'player');
                if (player.hp <= 0) {
                    showOverlay("GAME OVER", "勇者の伝説はここで途絶えた...");
                    return;
                }
            }
            setTimeout(nextQuestion, 1200);
        }
        function getAffinity(atkType, defType) {
            if (atkType === 'fire' && defType === 'grass') return 1.5;
            if (atkType === 'grass' && defType === 'water') return 1.5;
            if (atkType === 'water' && defType === 'fire') return 1.5;
            if (atkType === 'fire' && defType === 'water') return 0.5;
            if (atkType === 'water' && defType === 'grass') return 0.5;
            if (atkType === 'grass' && defType === 'fire') return 0.5;
            return 1.0;
        }
        async function performAttack(target, damage, targetType) {
            target.classList.add('animate-shake');
            if (targetType === 'enemy') {
                currentEnemy.hp = Math.max(0, currentEnemy.hp - damage);
            } else {
                player.hp = Math.max(0, player.hp - damage);
                elFlash.className = "screen-flash damage-red";
                setTimeout(() => elFlash.className = "screen-flash", 300);
            }
            updateHPRender();
            return new Promise(resolve => setTimeout(() => {
                target.classList.remove('animate-shake');
                resolve();
            }, 500));
        }
        function updateHPRender() {
            const pPercent = (player.hp / player.maxHp) * 100;
            elPlayerHpBar.style.width = `${pPercent}%`;
            elPlayerHpText.innerText = `${player.hp}/${player.maxHp}`;
            elPlayerHpBar.className = pPercent < 25 ? "hp-bar-inner h-full bg-red-600" : (pPercent < 50 ? "hp-bar-inner h-full bg-yellow-500" : "hp-bar-inner h-full bg-green-500");
            const ePercent = (currentEnemy.hp / currentEnemy.maxHp) * 100;
            elEnemyHpBar.style.width = `${ePercent}%`;
            const expPercent = (player.exp / player.nextExp) * 100;
            elPlayerExpBar.style.width = `${expPercent}%`;
            elPlayerExpText.innerText = `${player.exp}/${player.nextExp}`;
        }
        async function handleEnemyDefeat() {
            updateMessage(`${currentEnemy.name}を完全に沈めた！`);
            player.exp += currentEnemy.exp;
            await new Promise(r => setTimeout(r, 1000));
            if (player.exp >= player.nextExp) {
                player.lv++;
                player.exp -= player.nextExp;
                player.nextExp = Math.floor(player.nextExp * 1.6);
                player.maxHp += 30;
                player.hp = player.maxHp;
                player.atk += 8;
                elPlayerLv.innerText = player.lv;
                updateMessage(`レベルアップ！ 最大HPと攻撃力が大幅に上昇！`);
                elFlash.className = "screen-flash heal-green";
                setTimeout(() => elFlash.className = "screen-flash", 300);
                await new Promise(r => setTimeout(r, 1200));
            }
            currentStage++;
            if (currentStage >= ENEMIES.length + 4) { 
                showOverlay("QUIZ MASTER", "全てのモンスターを討伐し、伝説となった！");
            } else {
                initStage();
            }
        }
        function showOverlay(title, desc) {
            document.getElementById('overlay-title').innerText = title;
            document.getElementById('overlay-desc').innerText = desc;
            elOverlay.classList.remove('hidden');
            elOverlay.classList.add('flex');
        }
        function resetGame() {
            player = { lv: 1, hp: 100, maxHp: 100, atk: 10, exp: 0, nextExp: 10 };
            currentStage = 0;
            elPlayerLv.innerText = player.lv;
            elOverlay.classList.add('hidden');
            elOverlay.classList.remove('flex');
            initStage();
        }
        window.onload = initStage;
    </script>
</body>
</html>
